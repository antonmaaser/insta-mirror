<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media · Instagram mirror</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.5 Inter, system-ui, sans-serif; }
    body { max-width: 52rem; margin: clamp(1rem, 5vw, 4rem) auto; padding: 0 1rem; }
    h1 { margin: 0 0 1rem; font-size: 1.75rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .65rem .45rem; border-bottom: 1px solid GrayText; overflow-wrap: anywhere; }
    .size { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    a { text-underline-offset: .18em; }
    nav { display: flex; gap: 1.25rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>Media</h1>
    {{if .Items}}
    <table>
      <thead>
        <tr>
          <th scope="col">Type</th>
          <th scope="col" class="size">Size</th>
          <th scope="col">Sender</th>
          <th scope="col">File</th>
        </tr>
      </thead>
      <tbody>
        {{range .Items}}
        <tr>
          <td>{{.MIME}}</td>
          <td class="size">{{size .Size}}</td>
          <td>{{.Sender}}</td>
          <td><a href="/media/download/{{.Hash}}" aria-label="Download {{.MIME}} from {{.Sender}}">Download</a></td>
        </tr>
        {{end}}
      </tbody>
    </table>
    {{else}}
    <p>No cached media on this page.</p>
    {{end}}
    {{if or .Previous .Next}}
    <nav aria-label="Media pages">
      {{if .Previous}}<a href="/media?page={{.Previous}}" rel="prev">Previous</a>{{end}}
      {{if .Next}}<a href="/media?page={{.Next}}" rel="next">Next</a>{{end}}
    </nav>
    {{end}}
  </main>
</body>
</html>
